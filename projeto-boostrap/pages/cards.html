<html lang="pt-br">
<head>
    <link href="../css/bootstrap.min.css" rel="stylesheet">

    <title>Cards</title>
</head>
<body class = "container py-5">
    <h2>Exemplo de Card</h2>
    <div class="card" style="width: 20rem">
        <img src="../img/tropeiro.jpg" class="card-img-top" alt="Feijão Tropeiro Mineiro" > <!-- imagem do card --> 
              <div class="card-body"></div>

              <a href = index.html class="btn btn-primary">Voltar</a> <!-- botão do card -->
    </div>
